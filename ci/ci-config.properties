# =======================================================
# CI System Configuration File
# =======================================================
# Description:
# 1. This file contains all non-sensitive CI configuration parameters
# 2. Modify configuration values below as needed
# 3. Use GitHub Secrets for sensitive information
# 4. Configuration file format: KEY=value (supports comments and quotes)
# =======================================================

# ---------------- Server Configuration ----------------
# Cloud server region (example region, select according to actual needs)
BUILD_SERVER_REGION=cn-hangzhou

# Server instance type (example type, select according to actual needs)
# Common choices: ecs.c6.xlarge (4 vCPU, 16GB RAM)
#                ecs.c6.large (2 vCPU, 8GB RAM)  
#                ecs.r6.xlarge (4 vCPU, 32GB RAM)
INSTANCE_TYPE=ecs.c6.xlarge

# ---------------- Target Project Configuration ----------------
# Target project repository URL to build (example repository, replace with actual project)
GITHUB_REPO=https://github.com/PBGZip/pbgz.git

# Target branch to build (example branch, replace with actual branch)
GITHUB_BRANCH=pbgz_v2.2.0

# ---------------- Build Script Configuration ----------------
# Relative path of GCC build script in project (example path, modify according to actual project structure)
BUILD_SCRIPT_GCC=3rd_party/build.all.gcc.sh

# Relative path of Release build script in project (example path, modify according to actual project structure)
BUILD_SCRIPT_RELEASE=build-release.sh

# ---------------- CI Script Repository Configuration ----------------
# Repository URL where CI scripts are located.
# The CI scripts (ci/ directory) live in the same repo as the target project,
# so this must point to the actual project repository.
GITHUB_CI_REPO=https://github.com/PBGZip/pbgz.git

# Branch of CI scripts (branch that contains the ci/ directory)
GITHUB_CI_BRANCH=pbgz_v2.2.0

# ---------------- Test Configuration ----------------
# Whether to enable test execution (true/false)
# Note: Scheduled builds and PR builds usually override this setting
TEST_ENABLED=false

# ---------------- MinIO Storage Configuration ----------------
# MinIO server endpoint (non-sensitive, e.g., play.min.io:9000 or your-server:9000)
MINIO_ENDPOINT=play.min.io:9000

# MinIO bucket names (non-sensitive bucket configurations)
MINIO_COMPRESSED_BUCKET=pbgz-compressed
MINIO_SOURCE_BUCKET=pbgz-source
MINIO_RESULTS_BUCKET=pbgz-results
MINIO_BACKUP_BUCKET=pbgz-backups

# MinIO connection settings (non-sensitive)
MINIO_SECURE=true
MINIO_REGION=us-east-1
MINIO_VERIFY_SSL=true

# MinIO operational settings (non-sensitive)
MINIO_UPLOAD_THREADS=4
MINIO_DOWNLOAD_THREADS=4
MINIO_TIMEOUT_CONNECT=60
MINIO_TIMEOUT_READ=600

# =======================================================
# Configuration Details
# =======================================================# 
# 1. Cloud server region selection:
#    - Alibaba Cloud East China: cn-hangzhou
#    - Alibaba Cloud North China: cn-beijing
#    - Alibaba Cloud South China: cn-shenzhen
#    - Alibaba Cloud Southwest: cn-chengdu
#    - AWS: us-east-1, us-west-2, etc.
#    - Tencent Cloud: ap-guangzhou, ap-shanghai, etc.
#
# 2. Instance type selection (Alibaba Cloud example):
#    - General purpose: ecs.c6.large/xlarge/2xlarge
#    - Compute optimized: ecs.c6.large/xlarge/2xlarge
#    - Memory optimized: ecs.r6.large/xlarge/2xlarge
#    - Detailed reference: https://help.aliyun.com/document_detail/25378.html
#
# 3. Server IP address:
#    - Server IP is automatically dynamically assigned by scripts, no configuration needed
#    - Server automatically creates and assigns public IP
#    - IP and server are automatically released after process ends
#
# 4. Required GitHub Secrets for Cloud Server:
#    - BUILD_SERVER_ACCESS_KEY_ID (Cloud server access key ID)
#    - BUILD_SERVER_ACCESS_KEY_SECRET (Cloud server access key secret)
#    - BUILD_SERVER_SSH_KEY (SSH private key for server)
#
# 5. Required GitHub Secrets for MinIO Storage:
#    - MINIO_ACCESS_KEY (MinIO service access key)
#    - MINIO_SECRET_KEY (MinIO service secret key)
#
# 6. Non-sensitive MinIO Configuration (configured in this file):
#    - MINIO_ENDPOINT (MinIO server endpoint, e.g., play.min.io:9000)
#    - MINIO_SECURE (Use HTTPS connection)
#    - MINIO_REGION (Storage region)
#    - MINIO_VERIFY_SSL (SSL certificate verification)
#    - MINIO_COMPRESSED_BUCKET (Bucket for compressed files)
#    - MINIO_SOURCE_BUCKET (Bucket for source files)
#    - MINIO_RESULTS_BUCKET (Bucket for test results)
#    - MINIO_BACKUP_BUCKET (Bucket for backups)
#
# 5. Configuration priority:
#    - ci-config.properties (highest)
#    - Workflow defaults (medium)
#    - System defaults (lowest)
#
# 6. Security considerations:
#    - Do not store sensitive information in this file
#    - Sensitive information must be stored in GitHub Secrets
#    - Regularly check and update configuration
#    - Create different configuration files for different environments
#
# =======================================================