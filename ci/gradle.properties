# pbgz_v2.2.0 CI Project Configuration File

# GitHub Configuration
github.repo=https://github.com/PBGZip/pbgz.git   # Set your GitHub repository URL here, e.g.: https://github.com/yourusername/pbgz.git
github.branch=pbgz_v2.2.0

# Build Script Configuration (relative paths, based on source code directory)
build.script.gcc=3rd_party/build.all.gcc.sh
build.script.release=build-release.sh

# Test Configuration
test.enabled=false              # Set to true to enable testing
test.script=                    # Specify test script path, e.g.: tests/run_tests.sh
test.command=                   # Or specify test command, e.g.: make test or pytest tests/

# Directory Configuration (optional, default uses project relative paths)
workspace.dir=./workspace
logs.dir=./logs

# Other Configuration
clean.before.build=true         # Whether to clean before build
verbose=true                    # Whether to display verbose output

# Notification Configuration
notify.enabled=true             # Whether to enable notification system
notify.script=./notify.sh       # Notification script path (relative to CI directory)