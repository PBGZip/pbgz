---
name: Manual Build

# Manually triggered build tasks
# Used to run complete build process on cloud build server

on:
  workflow_dispatch:

jobs:
  manual-build:
    name: Manual Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Display start information
      - name: Start Manual Build
        run: |
          echo "🚀 Starting manual build process"
          echo "Trigger time: $(date)"
          echo "Trigger type: manual (workflow_dispatch)"

      # Checkout code
      - uses: actions/checkout@v3

      # Read CI configuration file
      - name: Load CI Configuration
        run: |
          echo "Loading CI configuration file..."

          # Read configuration file and set environment variables
          if [ -f "ci/ci-config.properties" ]; then
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ $key =~ ^#.*$ ]] && continue
              [[ -z $key ]] && continue

              # Remove quotes and spaces from values
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              value=$(echo "$value" |
                      sed 's/^["'\'''\'''"'"']\(.*\)["'\'''\'''"'"']$/\1/')

              # Set environment variables
              echo "$key=$value" >> $GITHUB_ENV
              echo "✅ Configuration $key=$value"
            done < ci/ci-config.properties
          else
            echo "⚠️ Configuration file ci/ci-config.properties does not exist"
            echo "using default values"

          # Set default values
          echo "BUILD_SERVER_REGION=cn-hangzhou" >> $GITHUB_ENV
          echo "INSTANCE_TYPE=ecs.c6.xlarge" >> $GITHUB_ENV
          echo "GITHUB_REPO=https://github.com/PBGZip/pbgz.git" >> $GITHUB_ENV
          echo "GITHUB_BRANCH=pbgz_v2.2.0" >> $GITHUB_ENV
          echo "BUILD_SCRIPT_GCC=3rd_party/build.all.gcc.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT_RELEASE=build-release.sh" >> $GITHUB_ENV
          echo "GITHUB_CI_REPO=https://github.com/your-username/pbgz_ci.git" >>
          $GITHUB_ENV
          echo "GITHUB_CI_BRANCH=main" >> $GITHUB_ENV
          echo "TEST_ENABLED=false" >> $GITHUB_ENV
          fi

          echo "✅ CIConfiguration loading completed"

      # Configure SSH key
      # NOTE: Actual server IP is dynamically set after server creation step
      # Here only configure SSH key, do not configure known_hosts
      - name: Setup SSH Key
        run: |
          echo "🔧 Configuring SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.BUILD_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "✅ SSH key configuration completed"

      # Script 001: Create build server
      - name: Create Build Server
        run: bash ci/scripts/create-build-server.sh
        env:
          BUILD_SERVER_ACCESS_KEY_ID: ${{ secrets.BUILD_SERVER_ACCESS_KEY_ID }}
          BUILD_SERVER_ACCESS_KEY_SECRET: ${{ secrets.BUILD_SERVER_ACCESS_KEY_SECRET }}
          BUILD_SERVER_REGION: ${{ env.BUILD_SERVER_REGION }}
          INSTANCE_TYPE: ${{ env.INSTANCE_TYPE }}
          SERVER_NAME: >-
            pbgz-ci-manual-$(date +%Y%m%d-%H%M%S)

      # Script 002: Prepare build environment
      - name: Prepare Build Environment
        run: bash ci/scripts/prepare-build-environment.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}

      # Script 004: Run Gradle build (including source download, GCC build, Release build, testing)
      - name: Run Gradle Build
        run: bash ci/scripts/run-gradle-build.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          BUILD_SCRIPT_GCC: ${{ env.BUILD_SCRIPT_GCC }}
          BUILD_SCRIPT_RELEASE: ${{ env.BUILD_SCRIPT_RELEASE }}
          GITHUB_CI_REPO: ${{ env.GITHUB_CI_REPO }}
          GITHUB_CI_BRANCH: ${{ env.GITHUB_CI_BRANCH }}

      # Script 006: Collect build artifacts
      - name: Collect Build Artifacts
        if: always()
        run: bash ci/scripts/collect-artifacts.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}

      # Upload build artifacts
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: manual-build-artifacts
          path: |
            ci_logs_*.tar.gz
            build_artifacts_*.tar.gz
          if-no-files-found: warn

      # Script 007: Terminate build server and cleanup resources
      - name: Terminate Build Server and Cleanup
        if: always()
        run: bash ci/scripts/terminate-build-server.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}
          BUILD_SERVER_ACCESS_KEY_ID: ${{ secrets.BUILD_SERVER_ACCESS_KEY_ID }}
          BUILD_SERVER_ACCESS_KEY_SECRET: ${{ secrets.BUILD_SERVER_ACCESS_KEY_SECRET }}

      # Script 008: Cleanup temporary resources
      - name: Cleanup Resources
        if: always()
        run: bash ci/scripts/cleanup-resources.sh

      # Display completion information
      - name: Manual Build Complete
        if: always()
        run: |
          echo "🎉 Manual build completed"
          echo ""
          echo "📋 Build results:"
          echo "  ✅ Cloud build server created and configured"
          echo "  ✅ CI script repository downloaded"
          echo "  ✅ Gradle environment configured"
          echo "  ✅ Complete CI process executed via Gradle"
          echo "     (source download, GCC build, Release build, testing)"
          echo "  ✅ Build artifacts collected"
          echo "  ✅ Cloud build server terminated"
          echo "  ✅ Temporary resources cleaned up"
          echo ""
          echo "❓ View details: Actions -> History -> Current run"
