---
name: PR Build

# PR-triggered build tasks
# Automatically runs when creating or updating PR to verify code quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]
  # Allow manual trigger for debugging
  workflow_dispatch:

jobs:
  pr-build:
    name: PR Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Display start information
      - name: Start PR Build
        run: |
          echo "🚀 Starting PR build process"
          echo "Trigger time: $(date)"
          echo "Trigger type: pull_request"
          echo "PR number: ${{ github.event.pull_request.number }}"

      # Checkout code
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Read CI configuration file
      - name: Load CI Configuration
        run: |
          echo "Loading CI configuration file..."

          if [ -f "ci/ci-config.properties" ]; then
            while IFS='=' read -r key value; do
              [[ $key =~ ^#.*$ ]] && continue
              [[ -z $key ]] && continue

              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              value=$(echo "$value" |
                      sed 's/^["'\'''\'''"'"']\(.*\)["'\'''\'''"'"']$/\1/')
              echo "$key=$value" >> $GITHUB_ENV
              echo "✅ Configuration $key=$value"
            done < ci/ci-config.properties
          else
            echo "⚠️ Configuration file ci/ci-config.properties does not exist"
            echo "using default values"

            echo "BUILD_SERVER_REGION=cn-hangzhou" >> $GITHUB_ENV
            echo "INSTANCE_TYPE=ecs.c6.xlarge" >> $GITHUB_ENV
            echo "GITHUB_REPO=https://github.com/PBGZip/pbgz.git" >> $GITHUB_ENV
            echo "GITHUB_BRANCH=pbgz_v2.2.0" >> $GITHUB_ENV
            echo "BUILD_SCRIPT_GCC=3rd_party/build.all.gcc.sh" >> $GITHUB_ENV
            echo "BUILD_SCRIPT_RELEASE=build-release.sh" >> $GITHUB_ENV
            echo "GITHUB_CI_REPO=https://github.com/your-username/pbgz_ci.git" >>
            $GITHUB_ENV
            echo "GITHUB_CI_BRANCH=main" >> $GITHUB_ENV
            echo "TEST_ENABLED=true" >> $GITHUB_ENV
          fi
          echo "✅ CI configuration loading completed"

      # Configure SSH key
      # NOTE: Actual server IP is dynamically set after server creation step
      # Here only configure SSH key, do not configure known_hosts
      # Export BUILD_SERVER_SSH_KEY so downstream scripts can read it from env
      - name: Setup SSH Key
        run: |
          echo "🔧 Configuring SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.BUILD_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "BUILD_SERVER_SSH_KEY=${{ secrets.BUILD_SERVER_SSH_KEY }}" >> $GITHUB_ENV
          echo "✅ SSH key configuration completed"

      # Script 001: Create build server
      - name: Create Build Server
        run: bash ci/scripts/create-build-server.sh
        env:
          BUILD_SERVER_ACCESS_KEY_ID: ${{ secrets.BUILD_SERVER_ACCESS_KEY_ID }}
          BUILD_SERVER_ACCESS_KEY_SECRET: ${{ secrets.BUILD_SERVER_ACCESS_KEY_SECRET }}
          BUILD_SERVER_REGION: ${{ env.BUILD_SERVER_REGION }}
          INSTANCE_TYPE: ${{ env.INSTANCE_TYPE }}
          SERVER_NAME: >-
            pbgz-ci-pr-${{ github.event.pull_request.number }}-$(date +%Y%m%d-%H%M%S)

      # Export server IP to GITHUB_ENV for downstream steps
      - name: Export Server IP
        run: |
          source /tmp/build_server_info.env
          echo "BUILD_SERVER_IP=$BUILD_SERVER_PUBLIC_IP" >> $GITHUB_ENV
          echo "✅ Exported server IP: $BUILD_SERVER_PUBLIC_IP"

      # Script 002: Prepare build environment
      - name: Prepare Build Environment
        run: bash ci/scripts/prepare-build-environment.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}

      # Script 004: Run Gradle build (including source download, GCC build, Release build, testing)
      - name: Run Gradle Build
        run: bash ci/scripts/run-gradle-build.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_BRANCH: ${{ env.GITHUB_BRANCH }}
          BUILD_SCRIPT_GCC: ${{ env.BUILD_SCRIPT_GCC }}
          BUILD_SCRIPT_RELEASE: ${{ env.BUILD_SCRIPT_RELEASE }}
          GITHUB_CI_REPO: ${{ env.GITHUB_CI_REPO }}
          GITHUB_CI_BRANCH: ${{ env.GITHUB_CI_BRANCH }}
          TEST_ENABLED: "true"
          TEST_SCRIPT: "ci/scripts/run_all_tests.sh"

      # Setup MinIO Storage Environment
      - name: Setup MinIO Storage
        run: |
          echo "🗄️ Setting up MinIO storage environment for PR build..."
           
           # Non-sensitive configuration already loaded from ci-config.properties
           # Sensitive configuration from GitHub Secrets
           echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> $GITHUB_ENV
           echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> $GITHUB_ENV
           
           echo "✅ MinIO storage environment configured"
           echo "   Endpoint: $MINIO_ENDPOINT"
           echo "   PR Results Bucket: $MINIO_RESULTS_BUCKET"

      # Script 005: Verify Gradle test results (testing already integrated in Gradle process)
      - name: Verify Gradle Test Results
        if: always()
        run: bash ci/scripts/verify-test-results.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}
          TEST_ENABLED: "true"

      # Script 006: Collect build artifacts
      - name: Collect Build Artifacts
        if: always()
        run: bash ci/scripts/collect-artifacts.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}

      # Upload build artifacts
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            pr-build-artifacts-${{ github.event.pull_request.number }}
          path: |
            /tmp/artifacts/*.tar.gz
          if-no-files-found: warn

      # Upload build results and test logs to MinIO object storage
      - name: Upload to MinIO
        if: always()
        run: |
          echo "🗄️ Uploading build results to MinIO..."
          export WORKFLOW_TYPE=pr-build
          export BUILD_SERVER_SSH_KEY="${{ secrets.BUILD_SERVER_SSH_KEY }}"
          bash ci/scripts/minio-storage.sh upload-artifacts "/tmp/artifacts/*.tar.gz"
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}

      # Script 007: Terminate build server and cleanup resources
      - name: Terminate Build Server and Cleanup
        if: always()
        run: bash ci/scripts/terminate-build-server.sh
        env:
          BUILD_SERVER_IP: ${{ env.BUILD_SERVER_IP }}
          BUILD_SERVER_ACCESS_KEY_ID: ${{ secrets.BUILD_SERVER_ACCESS_KEY_ID }}
          BUILD_SERVER_ACCESS_KEY_SECRET: ${{ secrets.BUILD_SERVER_ACCESS_KEY_SECRET }}

      # Script 008: Cleanup temporary resources
      - name: Cleanup Resources
        if: always()
        run: bash ci/scripts/cleanup-resources.sh

      # Post results to PR
      - name: Comment PR with Results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ github.event.pull_request.number }};
            const status = process.env.JOB_STATUS === 'success'
              ? '✅ Success' : '❌ Failure';
            const comment = `## 🚀 PR Build Results

            **Status:** ${status}

            **Build Information:**
            - PR Number: #${prNumber}
            - Build Time: ${new Date().toLocaleString()}
            - Commit: ${{ github.event.pull_request.head.sha }}
            - Build Method: Gradle Complete CI Process

            **Detailed Logs:**
            Please view build logs in Actions for detailed information.

            ${
              process.env.JOB_STATUS !== 'success'
              ? '⚠️ **Warning:** Build failed, please check logs for fixes before merging.'
              : '✅ **Recommendation:** Build passed, can review and merge.'
            }`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # Display completion information
      - name: PR Build Complete
        if: always()
        run: |
          echo "🎉 PR build completed"
          echo ""
          echo "📋 Build results:"
          echo "  ✅ Cloud build server created and configured"
          echo "  ✅ CI script repository downloaded"
          echo "  ✅ Gradle environment configured"
          echo "  ✅ Complete CI process executed via Gradle"
          echo "     (source download, GCC build, Release build, testing)"
          echo "  ✅ Build artifacts collected"
          echo "  ✅ Build results posted to PR"
          echo "  ✅ Cloud build server terminated"
          echo "  ✅ Temporary resources cleaned up"
          echo ""
          echo "❓ View details: Actions -> History -> PR #${{ github.event.pull_request.number }}"

  # Set PR status check
  pr-status-check:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: pr-build

    steps:
      - name: Set PR Status
        run: |
          if [ "${{ needs.pr-build.result }}" = "success" ]; then
            echo "✅ PR build passed"
            exit 0
          else
            echo "❌ PR build failed"
            exit 1
          fi
